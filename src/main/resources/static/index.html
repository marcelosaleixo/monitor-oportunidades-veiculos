<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Oportunidades</title><style>
:root{font-family:Inter,system-ui,Arial;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#102b4e;color:white;padding:22px max(20px,calc((100% - 1180px)/2))}.top h1{margin:0;font-size:clamp(22px,4vw,32px)}.top p{margin:7px 0 0;color:#cbd8e8}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel,.card{background:white;border:1px solid #e5eaf1;border-radius:14px;box-shadow:0 4px 16px #1720330a}.stat{padding:18px}.stat small{color:#64748b}.stat strong{display:block;font-size:25px;margin-top:7px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 14px}.toolbar button{background:#087f5b;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:600;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{display:flex;overflow:hidden;min-height:170px}.card img{width:38%;object-fit:cover;background:#e9eef5}.info{padding:15px;min-width:0}.info h3{margin:0 0 8px;font-size:17px}.muted{color:#64748b;font-size:13px}.price{font-weight:700;margin-top:10px}.profit{color:#087f5b;font-size:20px;font-weight:800;margin-top:7px}.empty{padding:25px;text-align:center;color:#64748b}.status{font-size:13px;color:#64748b}@media(max-width:700px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:145px}.card img{width:34%}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><h1>Monitor de Oportunidades</h1><p>Veículos em Mato Grosso · Capital R$ 80.000 · Lucro líquido mínimo R$ 2.999</p></header>
<main class="wrap"><section class="stats"><div class="stat"><small>Anúncios coletados</small><strong id="total">—</strong></div><div class="stat"><small>Oportunidades qualificadas</small><strong id="count">—</strong></div><div class="stat"><small>Última atualização</small><strong id="updated" style="font-size:17px">—</strong></div></section>
<div class="toolbar"><div><b>Oportunidades identificadas</b><div class="status" id="status">Carregando dados...</div></div><button onclick="coletar()">Executar coleta agora</button></div><section id="cards" class="grid"></section></main>
<script>
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
async function carregar(){try{const [s,o]=await Promise.all([fetch('/api/monitor/status').then(r=>r.json()),fetch('/api/oportunidades').then(r=>r.json())]);document.querySelector('#total').textContent=s.anuncios;document.querySelector('#count').textContent=s.oportunidades;document.querySelector('#updated').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});document.querySelector('#status').textContent='Estimativa baseada em anúncios comparáveis cadastrados; confira o veículo antes de comprar.';const box=document.querySelector('#cards');box.innerHTML='';if(!o.length){box.innerHTML='<div class="panel empty">Nenhuma oportunidade atende aos filtros no momento. Verifique se a coleta está habilitada e se há anúncios comparáveis.</div>';return}o.forEach(x=>{const el=document.createElement('article');el.className='card';const img=document.createElement('img');img.src=x.imagemUrl||'';img.alt='Foto do veículo';img.onerror=()=>img.style.display='none';const info=document.createElement('div');info.className='info';const title=document.createElement('h3');title.textContent=[x.marca,x.modelo,x.anoModelo].filter(Boolean).join(' ');const sub=document.createElement('div');sub.className='muted';sub.textContent=(x.localidade||'MT')+' · '+x.comparaveis+' anúncios comparáveis';const price=document.createElement('div');price.className='price';price.textContent='Compra: '+brl(x.precoCompra)+' · Referência: '+brl(x.revendaReferencia);const profit=document.createElement('div');profit.className='profit';profit.textContent='Lucro estimado: '+brl(x.lucroEstimado);info.append(title,sub,price,profit);if(x.anuncioUrl){const a=document.createElement('a');a.href=x.anuncioUrl;a.target='_blank';a.rel='noopener';a.textContent='Ver anúncio';a.style.color='#1764a5';info.append(a)}el.append(img,info);box.append(el)})}catch(e){document.querySelector('#status').textContent='Não foi possível carregar a API. Verifique conexão e configuração.'}}
async function coletar(){const b=document.querySelector('button');b.disabled=true;b.textContent='Coletando...';try{const r=await fetch('/api/coleta/executar',{method:'POST'});if(!r.ok)throw new Error();await carregar();document.querySelector('#status').textContent='Coleta concluída.'}catch(e){document.querySelector('#status').textContent='Coleta não executada. Verifique fonte habilitada e conexão.'}finally{b.disabled=false;b.textContent='Executar coleta agora'}}
carregar();
</script></body></html>
